services:
  - type: web
    name: arkheia-cps-backend
    env: python
    plan: starter
    region: oregon

    buildCommand: pip install -r requirements.txt

    startCommand: python -m uvicorn cps_backend.api:app --host 0.0.0.0 --port 8000

    autoDeploy: true

    envVars:
      PYTHON_VERSION: 3.14
